// This file is part of DynExp.

syntax = "proto3";

package DynExpProto.Common;

// See definition of DynExp::UnitType in Units.h
enum FrequencyUnitType
{
	Hz = 0;
	nm = 1;
	Inv_cm = 2;
}

// See definition of DynExp::UnitType in Units.h
enum IntensityUnitType
{
	Arbitrary = 0;
	LogicLevel = 1;
	Counts = 2;
	Volt = 3;
	Ampere = 4;
	Power_W = 5;
	Power_dBm = 6;
}

message VoidMessage {}

message OptionalBoolMessage
{
	optional bool Value = 1;
}