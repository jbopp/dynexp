// This file is part of DynExp.

syntax = "proto3";

import public "Common.proto";

package DynExpProto.NetworkLaser;

enum StateType
{
	Ready = 0;
	Startup = 1;
	EnabledConstant = 2;
	EnabledScanning = 3;
	ErrorState = 4;
}

enum ResultType
{
	OK = 0;
	GeneralError = 1;
	InvalidValue = 2;
	InvalidMethod = 3;
}

message DeviceInfoMessage
{
	DynExpProto.Common.FrequencyUnitType FrequencyUnit = 1;
	DynExpProto.Common.IntensityUnitType IntensityUnit = 2;
	double HardwareMinFrequency = 3;                            // in units of FrequencyUnit
	double HardwareMaxFrequency = 4;                            // in units of FrequencyUnit
	double HardwareMinIntensity = 5;                            // in units of IntensityUnit
	double HardwareMaxIntensity = 6;                            // in units of IntensityUnit
	double HardwareMinScanRange = 7;							// in units of FrequencyUnit
	double HardwareMaxScanRange = 8;							// in units of FrequencyUnit
	double HardwareMinScanRate = 9;                             // in units of FrequencyUnit per second
	double HardwareMaxScanRate = 10;							// in units of FrequencyUnit per second
	double HardwareModeHopFreeTuningRange = 11;                 // in units of FrequencyUnit
}

message StateMessage
{
	StateType State = 1;
}

message FrequencyMessage
{
	double Frequency = 1;
}

message IntensityMessage
{
	double Intensity = 1;
}

message ScanRangeMessage
{
	double ScanRangeInFreqUnit = 1;
}

message ScanRateMessage
{
	double ScanRateInFreqUnitPerSecond = 1;
}

message ResultMessage
{
	ResultType Result = 1;
}

service NetworkLaser
{
	rpc GetDeviceInfo (DynExpProto.Common.VoidMessage) returns (DeviceInfoMessage);
	rpc GetState (DynExpProto.Common.VoidMessage) returns (StateMessage);

	rpc SetFrequency (FrequencyMessage) returns (ResultMessage);
	rpc GetFrequency (DynExpProto.Common.VoidMessage) returns (FrequencyMessage);
	rpc SetIntensity (IntensityMessage) returns (ResultMessage);
	rpc GetIntensity (DynExpProto.Common.VoidMessage) returns (IntensityMessage);
	rpc SetScanRange (ScanRangeMessage) returns (ResultMessage);
	rpc GetScanRange (DynExpProto.Common.VoidMessage) returns (ScanRangeMessage);
	rpc SetScanRate (ScanRateMessage) returns (ResultMessage);
	rpc GetScanRate (DynExpProto.Common.VoidMessage) returns (ScanRateMessage);

	rpc Enable (DynExpProto.Common.VoidMessage) returns (ResultMessage);
	rpc Disable (DynExpProto.Common.VoidMessage) returns (DynExpProto.Common.VoidMessage);
	rpc ScanContinuously (DynExpProto.Common.VoidMessage) returns (ResultMessage);
	rpc DisableScan (DynExpProto.Common.VoidMessage) returns (DynExpProto.Common.VoidMessage);
}